name: YT Longform Auto-Comment

on:
  schedule:
    # GH Actions 예약은 상습 1~3시간 지연됨(실측 10:39~12:18 UTC) + 가끔 아예 스킵됨.
    # → 하루 2번 돌려 놓침 방지. yt_commented.json 이 중복 막으니 두 번 돌아도 안전.
    - cron: '30 9 * * *'      # 09:30 UTC = 18:30 KST (롱폼 18:00 공개 직후)
    - cron: '30 14 * * *'     # 14:30 UTC = 23:30 KST (1차가 스킵/지연됐을 때 백업)
  workflow_dispatch:
    inputs:
      mode:
        # ⚠️ 기본값을 '--list'로 두면 수동 트리거가 목록만 뽑고 댓글을 안 담(빈문자 넘겨도 기본값이 먹힘).
        #    cron(schedule)은 inputs가 없어 항상 ''=댓글 달기로 동작. 수동도 같게 맞춤.
        description: "실행 모드 (빈칸=댓글 달기(기본), '--list'=상태만 확인)"
        default: ''

permissions:
  contents: write             # yt_commented.json 커밋용

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-yt.txt
      - name: Post CTA comments on newly public longforms
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || '' }}"
          python yt_comment.py $MODE
      - name: Commit commented state
        if: ${{ github.event.inputs.mode != '--list' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yt_commented.json
          git diff --staged --quiet || (git commit -m "chore: update yt_commented.json [skip ci]" && (git pull --rebase origin master && git push))
