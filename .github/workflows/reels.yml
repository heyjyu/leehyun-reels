name: IG Reels Auto-Publish

on:
  schedule:
    - cron: '0 9 * * *'      # 매일 09:00 UTC = 18:00 KST
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (--due=오늘분, --now=미발행전부, --list=상태만)'
        default: '--list'

permissions:
  contents: write             # published.json 커밋용

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Publish due reels
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || '--due' }}"
          python reels_upload.py $MODE
      - name: Commit published state
        if: ${{ github.event.inputs.mode != '--list' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published.json
          git diff --staged --quiet || (git commit -m "chore: update published.json [skip ci]" && git push)
