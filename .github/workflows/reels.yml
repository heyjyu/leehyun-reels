name: IG Reels Auto-Publish

on:
  schedule:
    - cron: '0 9 * * *'      # 매일 09:00 UTC = 18:00 KST
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (--due=오늘분, --now=미발행전부, --list=상태만, --diagnose F, --publish-cid CID:F)'
        default: '--list'
      attempt:
        description: '자동 재시도 회차(내부용)'
        default: '1'

permissions:
  contents: write             # published.json 커밋용
  actions: write              # 실패 시 새 러너로 자기 재디스패치용

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Publish due reels
        id: pub
        # ⚠️ rupload 400 ProcessingFailedError가 러너(IP)별 복불복(2026-07-25 관측:
        #    같은 코드·파일이 러너 따라 성공/실패) → 같은 런 안 재시도는 무의미.
        #    실패하면 아래 재디스패치 스텝이 "새 러너"로 다시 돌린다(최대 8회차).
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || '--due' }}"
          python reels_upload.py $MODE
      - name: Commit published state
        # 일부 성공 후 일부 실패해도 성공분 published.json은 반드시 커밋(중복발행 방지)
        if: ${{ github.event.inputs.mode != '--list' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published.json
          git diff --staged --quiet || (git commit -m "chore: update published.json [skip ci]" && git push)
      - name: Retry on fresh runner
        if: ${{ steps.pub.outcome == 'failure' && fromJSON(github.event.inputs.attempt || '1') < 8 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT=$(( ${{ github.event.inputs.attempt || '1' }} + 1 ))
          echo "재시도 ${NEXT}회차 디스패치(새 러너=새 IP)"
          gh workflow run reels.yml --repo "${{ github.repository }}" \
            -f mode="${{ github.event.inputs.mode || '--due' }}" -f attempt="$NEXT"
      - name: Final failure (no more retries)
        if: ${{ steps.pub.outcome == 'failure' && fromJSON(github.event.inputs.attempt || '1') >= 8 }}
        run: exit 1
      - name: Telegram alert on failure
        if: ${{ failure() }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && { echo "TELEGRAM_BOT_TOKEN 미설정 — 알림 생략(GitHub 실패메일은 감)"; exit 0; }
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d text="🚨 IG 릴스 자동발행 8회 재시도에도 실패 — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
