name: IG Reels Auto-Publish

on:
  schedule:
    - cron: '0 9 * * *'      # 매일 09:00 UTC = 18:00 KST
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (--due=오늘분, --now=미발행전부, --list=상태만)'
        default: '--list'

permissions:
  contents: write             # published.json 커밋용

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Publish due reels
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || '--due' }}"
          python reels_upload.py $MODE
      - name: Commit published state
        # always(): 일부 성공 후 일부 실패해도 성공분 published.json은 반드시 커밋(중복발행 방지)
        if: ${{ always() && github.event.inputs.mode != '--list' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published.json
          git diff --staged --quiet || (git commit -m "chore: update published.json [skip ci]" && git push)
      - name: Telegram alert on failure
        if: ${{ failure() }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && { echo "TELEGRAM_BOT_TOKEN 미설정 — 알림 생략(GitHub 실패메일은 감)"; exit 0; }
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d text="🚨 IG 릴스 자동발행 실패 — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
